name: Import Maid foundation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-maid.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print runner diagnostics
        run: |
          echo "Runner: $(uname -a)"
          echo "Commit: $GITHUB_SHA"
          git remote -v
          git branch --show-current
      - name: Download and validate upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Mobile-Artificial-Intelligence/maid.git /tmp/maid-upstream
          test -f /tmp/maid-upstream/LICENSE
          test -f /tmp/maid-upstream/package.json
          grep -q 'MIT License' /tmp/maid-upstream/LICENSE
      - name: Prepare isolated source branch
        shell: bash
        run: |
          set -euo pipefail
          # Import into the dedicated branch; keep main untouched.
          # A pre-existing maid-base branch is expected.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin maid-base
          git switch -C maid-base origin/maid-base
          git rm -rf --ignore-unmatch . >/dev/null
          git clean -fdx >/dev/null
          tar -C /tmp/maid-upstream --exclude=.git -cf - . | tar -xf -
          printf '\nDualMind foundation derived from Mobile-Artificial-Intelligence/maid (MIT). Original license retained.\n' >> README.md
          mkdir -p .github/workflows
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          Path('.github/workflows/dualmind-maid-android.yml').write_text(dedent("""\n          name: Build DualMind Maid Android
          on:
            push:
              branches: [maid-base]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              timeout-minutes: 90
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: yarn
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '17'
                - uses: android-actions/setup-android@v3
                - name: Install dependencies
                  run: yarn install --frozen-lockfile
                - name: Generate Android native project
                  run: npx expo prebuild --platform android --no-install --clean
                - name: Build debug APK
                  shell: bash
                  run: |
                    set -o pipefail
                    cd android
                    chmod +x gradlew
                    ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee ../android-build.log
                - name: Upload build failure diagnostics
                  if: failure()
                  uses: actions/upload-artifact@v4
                  with:
                    name: DualMind-Maid-build-diagnostics
                    path: android-build.log
                    if-no-files-found: warn
                - uses: actions/upload-artifact@v4
                  if: success()
                  with:
                    name: DualMind-Maid-debug-APK
                    path: android/app/build/outputs/apk/debug/*.apk
                    if-no-files-found: error
          """).lstrip())
          PY
          git add -A
          git commit -m 'Import MIT Maid foundation and Android build workflow'
          git push origin HEAD:refs/heads/maid-base
          git ls-remote --exit-code --heads origin maid-base
          # A GITHUB_TOKEN push does not trigger another push workflow.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/dualmind-maid-android.yml/dispatches" -f ref=maid-base
