name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        run: |
          set -o pipefail
          (
            while true; do
              sleep 120
              echo "[DualMind] Проверка: сборка всё ещё выполняется ($(date -u +%FT%TZ))" | tee -a build-status.log
            done
          ) &
          watcher_pid=$!
          trap 'kill "$watcher_pid" 2>/dev/null || true' EXIT
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DualMind-build-log
          path: |
            build.log
            build-status.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: DualMind-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
